<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Plurality accuracy across debate turns on GSM8K and SVAMP</title>
  <desc id="desc">Two line charts compare homogeneous solvers with dedicated checker roles. GSM8K uses forty samples per role condition; SVAMP uses twenty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="62" y="62" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">Role specialization changes the direction of debate</text>
  <text x="62" y="91" fill="#8fa2bd" font-family="Inter,Segoe UI,sans-serif" font-size="15">Plurality vote accuracy · Qwen2.5-1.5B · 3 agents × 4 turns · provider-default temperature</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="52" y="116" width="526" height="448" rx="20" fill="#0d1829" stroke="#21314b"/>
    <text x="78" y="154" fill="#dce7f7" font-size="18" font-weight="650">A · GSM8K replication</text>
    <text x="78" y="178" fill="#7186a3" font-size="13">Two disjoint cohorts · n=40 per role condition</text>
    <g stroke="#263750" stroke-dasharray="3 7"><line x1="112" y1="210" x2="550" y2="210"/><line x1="112" y1="265" x2="550" y2="265"/><line x1="112" y1="320" x2="550" y2="320"/><line x1="112" y1="375" x2="550" y2="375"/><line x1="112" y1="430" x2="550" y2="430"/></g>
    <g fill="#7186a3" font-size="12" text-anchor="end"><text x="101" y="214">100</text><text x="101" y="269">75</text><text x="101" y="324">50</text><text x="101" y="379">25</text><text x="101" y="434">0</text></g>
    <g fill="#8fa2bd" font-size="13" text-anchor="middle"><text x="150" y="462">T1</text><text x="280" y="462">T2</text><text x="410" y="462">T3</text><text x="540" y="462">T4</text></g>
    <polyline points="150,298 280,304 410,309 540,304" fill="none" stroke="#ff6b7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="150,298 280,287 410,282 540,282" fill="none" stroke="#67e8b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <polyline points="150,210 280,210 410,210 540,210" fill="none" stroke="#70a5ff" stroke-width="3" stroke-dasharray="8 7"/>
    <g fill="#08111f" stroke-width="3"><g stroke="#ff6b7a"><circle cx="150" cy="298" r="6"/><circle cx="280" cy="304" r="6"/><circle cx="410" cy="309" r="6"/><circle cx="540" cy="304" r="6"/></g><g stroke="#67e8b3"><circle cx="150" cy="298" r="6"/><circle cx="280" cy="287" r="6"/><circle cx="410" cy="282" r="6"/><circle cx="540" cy="282" r="6"/></g></g>
    <text x="540" y="327" text-anchor="end" fill="#ff9aa5" font-size="13" font-weight="650">−2.5 pp</text>
    <text x="540" y="270" text-anchor="end" fill="#8ff2c7" font-size="13" font-weight="650">+7.5 pp</text>

    <rect x="622" y="116" width="526" height="448" rx="20" fill="#0d1829" stroke="#21314b"/>
    <text x="648" y="154" fill="#dce7f7" font-size="18" font-weight="650">B · SVAMP robustness challenge</text>
    <text x="648" y="178" fill="#7186a3" font-size="13">Question-sensitive word problems · n=20 per role condition</text>
    <g stroke="#263750" stroke-dasharray="3 7"><line x1="682" y1="210" x2="1120" y2="210"/><line x1="682" y1="265" x2="1120" y2="265"/><line x1="682" y1="320" x2="1120" y2="320"/><line x1="682" y1="375" x2="1120" y2="375"/><line x1="682" y1="430" x2="1120" y2="430"/></g>
    <g fill="#7186a3" font-size="12" text-anchor="end"><text x="671" y="214">100</text><text x="671" y="269">75</text><text x="671" y="324">50</text><text x="671" y="379">25</text><text x="671" y="434">0</text></g>
    <g fill="#8fa2bd" font-size="13" text-anchor="middle"><text x="740" y="462">T1</text><text x="870" y="462">T2</text><text x="1000" y="462">T3</text><text x="1130" y="462">T4</text></g>
    <polyline points="740,265 870,309 1000,287 1130,287" fill="none" stroke="#ff6b7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="740,298 870,287 1000,287 1130,276" fill="none" stroke="#67e8b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <g fill="#08111f" stroke-width="3"><g stroke="#ff6b7a"><circle cx="740" cy="265" r="6"/><circle cx="870" cy="309" r="6"/><circle cx="1000" cy="287" r="6"/><circle cx="1130" cy="287" r="6"/></g><g stroke="#67e8b3"><circle cx="740" cy="298" r="6"/><circle cx="870" cy="287" r="6"/><circle cx="1000" cy="287" r="6"/><circle cx="1130" cy="276" r="6"/></g></g>
    <text x="1120" y="310" text-anchor="end" fill="#ff9aa5" font-size="13" font-weight="650">−10 pp</text>
    <text x="1120" y="264" text-anchor="end" fill="#8ff2c7" font-size="13" font-weight="650">+10 pp</text>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif" font-size="14">
    <circle cx="110" cy="620" r="6" fill="#ff6b7a"/><text x="126" y="625" fill="#cbd7e8">homogeneous solvers</text>
    <circle cx="340" cy="620" r="6" fill="#67e8b3"/><text x="356" y="625" fill="#cbd7e8">dedicated checker role</text>
    <line x1="610" y1="620" x2="638" y2="620" stroke="#70a5ff" stroke-width="3" stroke-dasharray="7 6"/><text x="652" y="625" fill="#cbd7e8">Luna-low ceiling control (GSM8K)</text>
  </g>
  <text x="62" y="679" fill="#657894" font-family="Inter,Segoe UI,sans-serif" font-size="12">Descriptive pilots. Curves show within-run direction; independent T1 sampling prevents a causal cross-run accuracy claim.</text>
</svg>
